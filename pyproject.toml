[project]
name = "work-sheet"
version = "0.1.0"
description = "Engine that turns Obsidian inbox threads into isolated agent tasks"
authors = [
    { name = "mUSicX" }
]
requires-python = ">=3.13"
dependencies = [
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
worksheet = "work_sheet.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
