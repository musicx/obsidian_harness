# Logical runner names used by roles/*.md -> the CLI invocation for each.
# CLI binaries and models come from the environment (.env); see .env.sample.
# A different environment changes .env; an entirely different CLI gets its own
# config directory (WORKSHEET_CONFIG_DIR). Roles stay unchanged either way.
# Placeholders filled per run: {system_prompt_file}, {system_prompt}, {prompt_file}, {view}.
# `format` tells the engine how to read stdout (text | pi-json | grok-json); the JSON formats report token usage.
#
# MCP: every pi runner loads the built-in MCP support and the servers in this machine's ~/.pi/agent/mcp.json.
# --no-extensions also turns off pi's built-in extensions, so -e brings back mcp, codemode (reaches servers with
# the default `codemode` exposure) and tool-search (`deferred` exposure); with an explicit --tools list those two
# must be named or they stay off. `mcp__*` lets every MCP tool through: to whitelist, replace it with the
# servers or tools a runner may use, e.g. `mcp__wiki__*,mcp__jira__get_*`.

[runners.small]
format = "pi-json"
command = [
  "${WORKSHEET_PI_BIN}", "-p", "--mode", "json", "--no-session", "--no-context-files", "--no-skills", "--no-extensions",
  "-e", "builtin:mcp", "-e", "builtin:codemode", "-e", "builtin:tool-search",
  "--tools", "codemode,tool_search,mcp__*",
  "--model", "${WORKSHEET_SMALL_MODEL}",
  "--append-system-prompt", "{system_prompt_file}",
  "@{prompt_file}",
]

[runners.strong]
format = "pi-json"
command = [
  "${WORKSHEET_PI_BIN}", "-p", "--mode", "json", "--no-session", "--no-context-files", "--no-skills", "--no-extensions",
  "-e", "builtin:mcp", "-e", "builtin:codemode", "-e", "builtin:tool-search",
  "--tools", "read,grep,find,ls,edit,write,codemode,tool_search,mcp__*",
  "--model", "${WORKSHEET_STRONG_MODEL}",
  "--append-system-prompt", "{system_prompt_file}",
  "@{prompt_file}",
]

# strong plus the read-only query tool `wsdata`, which the engine mounts in the view's .pi/mcp.json for tasks
# that name a data source; --approve trusts the view's project config so .pi/mcp.json is read in print mode.
[runners.analysis]
format = "pi-json"
command = [
  "${WORKSHEET_PI_BIN}", "-p", "--mode", "json", "--no-session", "--no-context-files", "--no-skills", "--no-extensions",
  "-e", "builtin:mcp", "-e", "builtin:codemode", "-e", "builtin:tool-search", "--approve",
  "--tools", "read,grep,find,ls,edit,write,codemode,tool_search,mcp__*",
  "--model", "${WORKSHEET_STRONG_MODEL}",
  "--append-system-prompt", "{system_prompt_file}",
  "@{prompt_file}",
]

[runners.web]
format = "grok-json"
command = [
  "${WORKSHEET_GROK_BIN}", "--prompt-file", "{prompt_file}", "--cwd", "{view}", "--output-format", "json",
  "--always-approve", "--no-subagents", "--no-plan", "--max-turns", "60",
  "--disallowed-tools", "run_terminal_cmd,Agent",
  "--rules", "{system_prompt}",
  "-m", "${WORKSHEET_WEB_MODEL}",
]

# Keep the user's global instruction files, skills and memory out of the role's context.
[runners.web.env]
GROK_CLAUDE_AGENTS_ENABLED = "false"
GROK_CLAUDE_RULES_ENABLED = "false"
GROK_CLAUDE_SKILLS_ENABLED = "false"
GROK_CLAUDE_MCPS_ENABLED = "false"
GROK_CLAUDE_HOOKS_ENABLED = "false"
GROK_CURSOR_AGENTS_ENABLED = "false"
GROK_CURSOR_RULES_ENABLED = "false"
GROK_CURSOR_SKILLS_ENABLED = "false"
GROK_CURSOR_MCPS_ENABLED = "false"
GROK_CURSOR_HOOKS_ENABLED = "false"
GROK_MEMORY = "0"
