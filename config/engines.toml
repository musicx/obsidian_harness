# Engines working on the same vault. Every engine process names itself with WORKSHEET_ENGINE_ID.
# A task goes to an engine that has the skill's runner and every resource the task needs;
# the coordinator does all global work (dispatch, templates, indexes, logs).
# A resource that is a data source must have the same name in that machine's datasources file.

[engines.oracle]
role = "coordinator"
description = "常驻服务器；网站和简报在这里"
runners = ["small", "strong", "analysis"]

[engines.oracle.resources]
oracle-clickhouse = "服务器上的 ClickHouse：A 股日线与参考数据、美股日线与 30 分钟线、外汇、加密货币"

[engines.mac]
role = "worker"
description = "个人电脑，不常开；可以联网搜集，能读本机文件（/Users/ 下的路径）"
runners = ["small", "strong", "web", "analysis"]

[engines.mac.resources]
a-share-data = "个人电脑上的 ClickHouse：A 股分钟线与日线、因子、基本面、资金流、期权期货、外汇、加密货币、美股；数据最全"
local-files = "个人电脑上的文件"
